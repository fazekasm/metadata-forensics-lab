# Template only. Review SECURITY.md before deployment.
app = "replace-with-your-unique-metadata-lab-name"
primary_region = "sea"
[env]
AUDIT_DIR = "/data/audit"
[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
[[mounts]]
source = "evidence_data"
destination = "/data"
[[vm]]
memory = "1gb"
cpus = 1
